<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#141618"/>
      <stop offset="1" stop-color="#24272a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#e8b86a" stop-opacity=".16"/>
      <stop offset="1" stop-color="#e8b86a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x2="0" y2="1">
      <stop stop-color="#222528"/>
      <stop offset="1" stop-color="#1a1c1e"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="930" cy="330" r="430" fill="url(#glow)"/>

  <!-- Omarchy bar -->
  <rect width="1200" height="56" fill="#0e0f10"/>
  <rect y="55" width="1200" height="1" fill="#2a2d2f"/>
  <text x="36" y="36" fill="#e7e3da" font-family="Inter, Noto Sans, sans-serif" font-size="18" font-weight="600">omarchy</text>
  <text x="160" y="36" fill="#e8b86a" font-family="Inter, Noto Sans, sans-serif" font-size="15" font-weight="600">1</text>
  <text x="182" y="36" fill="#7f8486" font-family="Inter, Noto Sans, sans-serif" font-size="15">2  3  4</text>
  <text x="1088" y="36" fill="#a9aca8" font-family="Inter, Noto Sans, sans-serif" font-size="14" text-anchor="end">Wi-Fi  ·  82%  ·  10:42</text>

  <!-- Fast Lid bar icon, active -->
  <rect x="1104" y="11" width="60" height="34" rx="9" fill="#2c2922" stroke="#e8b86a" stroke-opacity=".28" stroke-width="1.2"/>
  <rect x="1124" y="16" width="20" height="16" rx="2.6" fill="none" stroke="#e8b86a" stroke-width="1.8"/>
  <path d="M1120 34.5h28l-2.6 4.2h-22.8z" fill="#e8b86a"/>

  <!-- Connector from icon to panel -->
  <line x1="1134" y1="58" x2="1134" y2="124" stroke="#e8b86a" stroke-opacity=".38" stroke-width="1.4" stroke-dasharray="3 5"/>

  <!-- Headline -->
  <text x="80" y="152" fill="#e8b86a" font-family="Inter, Noto Sans, sans-serif" font-size="14" font-weight="700" letter-spacing="3.2">OMARCHY BAR WIDGET</text>
  <text x="76" y="234" fill="#f3f0e9" font-family="Inter, Noto Sans, sans-serif" font-size="64" font-weight="700">Fast Lid</text>
  <text x="80" y="284" fill="#b4b7b2" font-family="Inter, Noto Sans, sans-serif" font-size="22">Keep AI agents working while</text>
  <text x="80" y="314" fill="#b4b7b2" font-family="Inter, Noto Sans, sans-serif" font-size="22">your laptop lid is closed.</text>

  <!-- Feature rows -->
  <rect x="80" y="368" width="22" height="22" rx="6" fill="#a5c882" fill-opacity=".14"/>
  <path d="M85.5 379.5l3.6 3.6 7-7.4" fill="none" stroke="#a5c882" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="116" y="385" fill="#dfded8" font-family="Inter, Noto Sans, sans-serif" font-size="18">Lid-close + idle suspend inhibited</text>

  <rect x="80" y="410" width="22" height="22" rx="6" fill="#a5c882" fill-opacity=".14"/>
  <path d="M85.5 421.5l3.6 3.6 7-7.4" fill="none" stroke="#a5c882" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="116" y="427" fill="#dfded8" font-family="Inter, Noto Sans, sans-serif" font-size="18">Timed holds from 15 min to 8 h</text>

  <rect x="80" y="452" width="22" height="22" rx="6" fill="#a5c882" fill-opacity=".14"/>
  <path d="M85.5 463.5l3.6 3.6 7-7.4" fill="none" stroke="#a5c882" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="116" y="469" fill="#dfded8" font-family="Inter, Noto Sans, sans-serif" font-size="18">Unlimited ON for long agent runs</text>

  <text x="80" y="614" fill="#7d8280" font-family="Inter, Noto Sans, sans-serif" font-size="12" font-weight="600" letter-spacing="2">ONE SHARED HOLD ACROSS EVERY BAR SURFACE</text>

  <!-- Panel shadow + card -->
  <rect x="726" y="138" width="440" height="220" rx="18" fill="#000" opacity=".5" filter="url(#shadow)"/>
  <rect x="720" y="124" width="444" height="224" rx="16" fill="url(#panel)" stroke="#3a3d3a" stroke-width="1.5"/>

  <text x="760" y="160" fill="#8b908c" font-family="Inter, Noto Sans, sans-serif" font-size="11" font-weight="700" letter-spacing="2">LID HOLD</text>
  <rect x="1072" y="145" width="68" height="22" rx="11" fill="#a5c882" fill-opacity=".14"/>
  <text x="1106" y="160" fill="#a5c882" font-family="Inter, Noto Sans, sans-serif" font-size="10" font-weight="700" letter-spacing="1" text-anchor="middle">ACTIVE</text>

  <text x="942" y="204" fill="#f1eee7" font-family="Inter, Noto Sans, sans-serif" font-size="27" font-weight="700" text-anchor="middle">2 h 00 min 00 sec</text>

  <!-- Slider: 33 steps, 8/32 = 25% filled -->
  <rect x="760" y="242" width="364" height="8" rx="4" fill="#33373a"/>
  <rect x="760" y="242" width="91" height="8" rx="4" fill="#e8b86a"/>
  <g fill="#1a1c1e">
    <rect x="805" y="238" width="2" height="16" rx="1"/>
    <rect x="850" y="238" width="2" height="16" rx="1"/>
    <rect x="895" y="238" width="2" height="16" rx="1"/>
    <rect x="940" y="238" width="2" height="16" rx="1"/>
    <rect x="985" y="238" width="2" height="16" rx="1"/>
    <rect x="1030" y="238" width="2" height="16" rx="1"/>
    <rect x="1075" y="238" width="2" height="16" rx="1"/>
    <rect x="1120" y="238" width="2" height="16" rx="1"/>
  </g>
  <circle cx="851" cy="246" r="12" fill="#000" opacity=".45" filter="url(#soft)"/>
  <circle cx="851" cy="246" r="11" fill="#f1eee7" stroke="#0f1112" stroke-width="3"/>

  <text x="760" y="282" fill="#8b908c" font-family="Inter, Noto Sans, sans-serif" font-size="11" font-weight="600">OFF</text>
  <text x="1058" y="282" fill="#8b908c" font-family="Inter, Noto Sans, sans-serif" font-size="11" font-weight="600" text-anchor="end">8 h</text>
  <text x="1124" y="282" fill="#a5c882" font-family="Inter, Noto Sans, sans-serif" font-size="11" font-weight="700" text-anchor="end">ON</text>

  <text x="942" y="386" fill="#8b908c" font-family="Inter, Noto Sans, sans-serif" font-size="12" text-anchor="middle">Right-click toggles  ·  Left-click opens</text>
</svg>
