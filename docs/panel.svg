<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520">
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#141618"/>
      <stop offset="1" stop-color="#24272a"/>
    </linearGradient>
    <linearGradient id="panel" x2="0" y2="1">
      <stop stop-color="#222528"/>
      <stop offset="1" stop-color="#1a1c1e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#e8b86a" stop-opacity=".12"/>
      <stop offset="1" stop-color="#e8b86a" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="960" height="520" fill="url(#bg)"/>
  <circle cx="480" cy="250" r="380" fill="url(#glow)"/>

  <!-- Timed hold -->
  <rect x="126" y="76" width="708" height="178" rx="16" fill="#000" opacity=".45" filter="url(#shadow)"/>
  <rect x="120" y="68" width="720" height="178" rx="16" fill="url(#panel)" stroke="#3a3d3a" stroke-width="1.5"/>

  <text x="160" y="104" fill="#8b908c" font-family="Inter, Noto Sans, sans-serif" font-size="11" font-weight="700" letter-spacing="2">LID HOLD</text>
  <rect x="748" y="89" width="68" height="22" rx="11" fill="#a5c882" fill-opacity=".14"/>
  <text x="782" y="104" fill="#a5c882" font-family="Inter, Noto Sans, sans-serif" font-size="10" font-weight="700" letter-spacing="1" text-anchor="middle">ACTIVE</text>

  <text x="480" y="151" fill="#f1eee7" font-family="Inter, Noto Sans, sans-serif" font-size="27" font-weight="700" text-anchor="middle">2 h 00 min 00 sec</text>

  <rect x="160" y="188" width="640" height="8" rx="4" fill="#33373a"/>
  <rect x="160" y="188" width="160" height="8" rx="4" fill="#e8b86a"/>
  <g fill="#1a1c1e">
    <rect x="240" y="184" width="2" height="16" rx="1"/>
    <rect x="320" y="184" width="2" height="16" rx="1"/>
    <rect x="400" y="184" width="2" height="16" rx="1"/>
    <rect x="480" y="184" width="2" height="16" rx="1"/>
    <rect x="560" y="184" width="2" height="16" rx="1"/>
    <rect x="640" y="184" width="2" height="16" rx="1"/>
    <rect x="720" y="184" width="2" height="16" rx="1"/>
    <rect x="800" y="184" width="2" height="16" rx="1"/>
  </g>
  <circle cx="320" cy="192" r="11" fill="#000" opacity=".45" filter="url(#soft)"/>
  <circle cx="320" cy="192" r="11" fill="#f1eee7" stroke="#0f1112" stroke-width="3"/>

  <text x="160" y="228" fill="#8b908c" font-family="Inter, Noto Sans, sans-serif" font-size="11" font-weight="600">OFF</text>
  <text x="760" y="228" fill="#8b908c" font-family="Inter, Noto Sans, sans-serif" font-size="11" font-weight="600" text-anchor="end">8 h</text>
  <text x="840" y="228" fill="#a5c882" font-family="Inter, Noto Sans, sans-serif" font-size="11" font-weight="700" text-anchor="end">ON</text>

  <!-- Off -->
  <rect x="126" y="298" width="708" height="178" rx="16" fill="#000" opacity=".45" filter="url(#shadow)"/>
  <rect x="120" y="290" width="720" height="178" rx="16" fill="url(#panel)" stroke="#3a3d3a" stroke-width="1.5"/>

  <text x="160" y="326" fill="#8b908c" font-family="Inter, Noto Sans, sans-serif" font-size="11" font-weight="700" letter-spacing="2">LID HOLD</text>
  <rect x="748" y="311" width="68" height="22" rx="11" fill="#8b908c" fill-opacity=".14"/>
  <text x="782" y="326" fill="#a9aca8" font-family="Inter, Noto Sans, sans-serif" font-size="10" font-weight="700" letter-spacing="1" text-anchor="middle">OFF</text>

  <text x="480" y="373" fill="#f1eee7" font-family="Inter, Noto Sans, sans-serif" font-size="27" font-weight="700" text-anchor="middle">OFF</text>

  <rect x="160" y="410" width="640" height="8" rx="4" fill="#33373a"/>
  <g fill="#1a1c1e">
    <rect x="240" y="406" width="2" height="16" rx="1"/>
    <rect x="320" y="406" width="2" height="16" rx="1"/>
    <rect x="400" y="406" width="2" height="16" rx="1"/>
    <rect x="480" y="406" width="2" height="16" rx="1"/>
    <rect x="560" y="406" width="2" height="16" rx="1"/>
    <rect x="640" y="406" width="2" height="16" rx="1"/>
    <rect x="720" y="406" width="2" height="16" rx="1"/>
    <rect x="800" y="406" width="2" height="16" rx="1"/>
  </g>
  <circle cx="160" cy="414" r="11" fill="#000" opacity=".45" filter="url(#soft)"/>
  <circle cx="160" cy="414" r="11" fill="#f1eee7" stroke="#0f1112" stroke-width="3"/>

  <text x="160" y="450" fill="#8b908c" font-family="Inter, Noto Sans, sans-serif" font-size="11" font-weight="600">OFF</text>
  <text x="760" y="450" fill="#8b908c" font-family="Inter, Noto Sans, sans-serif" font-size="11" font-weight="600" text-anchor="end">8 h</text>
  <text x="840" y="450" fill="#a5c882" font-family="Inter, Noto Sans, sans-serif" font-size="11" font-weight="700" text-anchor="end">ON</text>

  <text x="480" y="500" fill="#8b908c" font-family="Inter, Noto Sans, sans-serif" font-size="12" text-anchor="middle">Left-click opens  ·  Right-click toggles the hold</text>
</svg>
